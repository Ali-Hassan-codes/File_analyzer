version: "3.9"

services:
  app:
    build: .
    ports:
      - "8001:8001"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ali
      DB_PASSWORD: 1234
      DB_NAME: mydb

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ali
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
